<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>领证一周年 ❤️</title>
  <style>
    /* ===== Design Tokens ===== */
    :root{
      --c-bg:#04030A;--c-bg-deep:#020106;--c-bg-mid:#11142A;--c-bg-glow:#181026;
      --c-pink-hot:#E84D86;--c-pink:#C83D72;--c-pink-dark:#9E2C58;--c-pink-deep:#B93465;
      --c-pink-light:#FF9DBD;--c-pink-pale:rgba(255,205,224,0.98);
      --c-gold:#F6D78B;--c-gold-soft:rgba(246,215,139,0.76);--c-moon:#F8F2E8;
      --c-blue:#8FC7FF;--c-violet:#BBA7FF;
      --c-purple:#CFA5E8;
      --c-text-glow:rgba(246,215,139,0.38);
      --c-text:rgba(255,244,236,0.96);--c-text-dim:rgba(246,215,139,0.66);--c-text-muted:rgba(255,220,230,0.34);
      --ease-out-back:cubic-bezier(0.175,0.885,0.32,1.275);
      --ease-out-expo:cubic-bezier(0.23,1,0.32,1);
      --radius-sm:6px;--radius-md:10px;--radius-lg:16px;
      --safe-bottom:calc(15px + env(safe-area-inset-bottom));
      --safe-top:calc(20px + env(safe-area-inset-top));
    }
    *{margin:0;padding:0;-webkit-box-sizing:border-box;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:var(--c-bg);
      font-family:"Songti SC","STSong","Noto Serif CJK SC","PingFang SC",serif;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
      -webkit-tap-highlight-color:transparent;touch-action:none;
      -webkit-overflow-scrolling:auto;overscroll-behavior:none}
    @media(prefers-reduced-motion:reduce){*{-webkit-animation-duration:0s!important;animation-duration:0s!important;-webkit-transition-duration:0s!important;transition-duration:0s!important}}
    canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
    #opening{position:fixed;inset:0;z-index:100;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,rgba(246,215,139,0.12) 0%,rgba(24,16,38,0.84) 28%,var(--c-bg) 100%);-webkit-transition:opacity 2s ease;transition:opacity 2s ease;will-change:opacity;overflow:hidden}
    #opening::before{content:'';position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,0.06) 42%,rgba(246,215,139,0.14) 50%,rgba(255,255,255,0.04) 58%,transparent 100%);-webkit-transform:translateX(-38%) rotate(-8deg);transform:translateX(-38%) rotate(-8deg);-webkit-animation:openingShine 6s ease-in-out infinite;animation:openingShine 6s ease-in-out infinite;pointer-events:none}
    @-webkit-keyframes openingShine{0%,100%{-webkit-transform:translateX(-42%) rotate(-8deg);opacity:0.25}45%{opacity:0.78}70%{-webkit-transform:translateX(42%) rotate(-8deg);opacity:0.12}}@keyframes openingShine{0%,100%{transform:translateX(-42%) rotate(-8deg);opacity:0.25}45%{opacity:0.78}70%{transform:translateX(42%) rotate(-8deg);opacity:0.12}}
    #opening.hide{opacity:0;pointer-events:none}
    .opening-orbit{position:absolute;width:260px;height:260px;border:1px solid rgba(246,215,139,0.13);border-radius:50%;box-shadow:0 0 80px rgba(246,215,139,0.08),inset 0 0 70px rgba(232,77,134,0.05);-webkit-animation:orbitBreath 5s ease-in-out infinite;animation:orbitBreath 5s ease-in-out infinite;pointer-events:none}
    .opening-orbit::before,.opening-orbit::after{content:'';position:absolute;left:50%;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--c-gold);box-shadow:0 0 18px rgba(246,215,139,0.9)}
    .opening-orbit::after{top:auto;bottom:18px;left:18%;width:5px;height:5px;background:var(--c-pink-light)}
    @-webkit-keyframes orbitBreath{0%,100%{-webkit-transform:scale(0.96) rotate(0deg);opacity:0.6}50%{-webkit-transform:scale(1.04) rotate(12deg);opacity:1}}@keyframes orbitBreath{0%,100%{transform:scale(0.96) rotate(0deg);opacity:0.6}50%{transform:scale(1.04) rotate(12deg);opacity:1}}
    .envelope{width:140px;height:100px;position:relative;cursor:pointer;-webkit-perspective:800px;perspective:800px;-webkit-animation:floatEnvelope 3s ease-in-out infinite;animation:floatEnvelope 3s ease-in-out infinite;-webkit-filter:drop-shadow(0 15px 40px rgba(246,215,139,0.24)) drop-shadow(0 0 40px rgba(232,77,134,0.22));filter:drop-shadow(0 15px 40px rgba(246,215,139,0.24)) drop-shadow(0 0 40px rgba(232,77,134,0.22));will-change:transform}
    @-webkit-keyframes floatEnvelope{0%,100%{-webkit-transform:translateY(0) rotate(-2deg);transform:translateY(0) rotate(-2deg)}33%{-webkit-transform:translateY(-10px) rotate(1deg);transform:translateY(-10px) rotate(1deg)}66%{-webkit-transform:translateY(-14px) rotate(2deg);transform:translateY(-14px) rotate(2deg)}}
    @keyframes floatEnvelope{0%,100%{transform:translateY(0) rotate(-2deg)}33%{transform:translateY(-10px) rotate(1deg)}66%{transform:translateY(-14px) rotate(2deg)}}
    .envelope-body{width:100%;height:100%;background:-webkit-linear-gradient(135deg,var(--c-pink-hot),var(--c-pink));background:linear-gradient(135deg,var(--c-pink-hot),var(--c-pink));-webkit-border-radius:var(--radius-md);border-radius:var(--radius-md);position:relative;-webkit-box-shadow:0 12px 50px rgba(216,27,96,0.5),0 0 80px rgba(216,27,96,0.2),inset 0 -2px 8px rgba(0,0,0,0.15),inset 0 2px 4px rgba(255,255,255,0.1);box-shadow:0 12px 50px rgba(216,27,96,0.5),0 0 80px rgba(216,27,96,0.2),inset 0 -2px 8px rgba(0,0,0,0.15),inset 0 2px 4px rgba(255,255,255,0.1)}
    .envelope-flap{position:absolute;top:-5px;left:0;width:0;height:0;border-left:70px solid transparent;border-right:70px solid transparent;border-top:50px solid var(--c-pink-dark);z-index:2;-webkit-transition:-webkit-transform 1.2s var(--ease-out-expo);transition:transform 1.2s var(--ease-out-expo);-webkit-transform-origin:top center;transform-origin:top center;-webkit-filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3))}
    .envelope.open .envelope-flap{-webkit-transform:rotateX(180deg);transform:rotateX(180deg)}
    .envelope-heart{position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-35%);transform:translate(-50%,-35%);font-size:32px;z-index:3;-webkit-transition:-webkit-transform 1.4s var(--ease-out-back) 0.6s,opacity 0.6s ease 1.2s;transition:transform 1.4s var(--ease-out-back) 0.6s,opacity 0.6s ease 1.2s;-webkit-filter:drop-shadow(0 0 20px rgba(255,105,180,0.6));filter:drop-shadow(0 0 20px rgba(255,105,180,0.6));will-change:transform,opacity}
    .envelope.open .envelope-heart{-webkit-transform:translate(-50%,-200px) scale(1.8);transform:translate(-50%,-200px) scale(1.8);opacity:0}
    .envelope-label{position:absolute;bottom:-10px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);font-size:11px;color:#2B1732;letter-spacing:2px;background:linear-gradient(135deg,#FFF2C8,var(--c-gold));padding:4px 14px;-webkit-border-radius:var(--radius-sm);border-radius:var(--radius-sm);white-space:nowrap;-webkit-box-shadow:0 4px 18px rgba(246,215,139,0.35);box-shadow:0 4px 18px rgba(246,215,139,0.35);font-weight:600}
    .envelope-seal{position:absolute;top:10px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);width:20px;height:20px;background:var(--c-pink-deep);-webkit-border-radius:50%;border-radius:50%;-webkit-box-shadow:0 2px 6px rgba(0,0,0,0.3);box-shadow:0 2px 6px rgba(0,0,0,0.3)}
    .open-tip{color:rgba(255,200,220,0.7);font-size:15px;margin-top:40px;letter-spacing:3px;-webkit-animation:tipPulse 2.5s ease-in-out infinite;animation:tipPulse 2.5s ease-in-out infinite;text-shadow:0 0 20px rgba(255,105,180,0.4)}
    @-webkit-keyframes tipPulse{0%,100%{opacity:0.5}50%{opacity:1}}@keyframes tipPulse{0%,100%{opacity:0.5}50%{opacity:1}}
    .open-sub{color:rgba(246,215,139,0.42);font-size:12px;margin-top:14px;letter-spacing:4px}
    .story-signal{position:fixed;inset:0;z-index:22;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;-webkit-transform:scale(0.96);transform:scale(0.96);-webkit-transition:opacity 1s ease,-webkit-transform 1.1s var(--ease-out-expo);transition:opacity 1s ease,transform 1.1s var(--ease-out-expo)}
    .story-signal.show{opacity:1;-webkit-transform:scale(1);transform:scale(1)}
    .signal-kicker{display:block;font-size:11px;letter-spacing:7px;color:rgba(246,215,139,0.55);margin-bottom:14px;text-transform:uppercase}
    .signal-main{display:block;font-size:clamp(34px,12vw,86px);line-height:1.05;font-weight:200;color:var(--c-moon);text-shadow:0 0 28px rgba(246,215,139,0.46),0 0 90px rgba(232,77,134,0.34)}
    .signal-sub{display:block;margin-top:14px;font-size:clamp(13px,3.4vw,18px);letter-spacing:3px;color:rgba(255,230,220,0.68)}
    .ui-layer{position:fixed;z-index:20;pointer-events:none;opacity:0;-webkit-transition:opacity 1.5s ease;transition:opacity 1.5s ease;will-change:opacity}
    .ui-layer.show{opacity:1}
    .top-bar{top:0;left:0;right:0;padding:var(--safe-top) 20px 0;text-align:center}
    .top-label{font-size:12px;letter-spacing:5px;color:var(--c-text-dim);text-shadow:0 0 10px rgba(255,105,180,0.3)}
    .top-num{font-size:clamp(52px,15vw,78px);font-weight:200;color:var(--c-gold-soft);line-height:1;text-shadow:0 0 40px rgba(246,215,139,0.55),0 0 100px rgba(143,199,255,0.18);-webkit-animation:numPulse 4.5s ease-in-out infinite;animation:numPulse 4.5s ease-in-out infinite;will-change:transform,opacity}
    @-webkit-keyframes numPulse{0%,100%{-webkit-transform:scale(1);opacity:0.98}50%{-webkit-transform:scale(1.02);opacity:1}}@keyframes numPulse{0%,100%{transform:scale(1);opacity:0.98}50%{transform:scale(1.02);opacity:1}}
    .top-unit{font-size:16px;color:var(--c-text-dim);letter-spacing:3px;margin-top:4px}
    .top-date{font-size:12px;color:var(--c-text-muted);margin-top:8px;letter-spacing:2px}
    .tap-hint{bottom:var(--safe-bottom);left:0;right:0;text-align:center;font-size:11px;color:var(--c-text-muted);letter-spacing:3px;-webkit-animation:hintFade 6s ease 3s forwards;animation:hintFade 6s ease 3s forwards}
    @-webkit-keyframes hintFade{to{opacity:0}}@keyframes hintFade{to{opacity:0}}
    #blessingPanel{position:fixed;top:50%;left:50%;-webkit-transform:translate(-50%,-45%);transform:translate(-50%,-45%);z-index:25;text-align:center;width:78%;max-width:340px;pointer-events:none;opacity:0;-webkit-transition:opacity 1s ease;transition:opacity 1s ease;will-change:opacity}
    #blessingPanel.show{opacity:1}
    .blessing-card{padding:8px 12px;position:relative}
    .blessing-section-label{font-size:9px;letter-spacing:4px;color:rgba(255,180,200,0.3);margin-bottom:12px;text-align:center}
    .blessing-line{font-size:14px;line-height:2.2;color:var(--c-text);text-shadow:0 0 30px var(--c-text-glow),0 0 8px rgba(0,0,0,0.5);opacity:0;-webkit-transform:translateY(15px);transform:translateY(15px);-webkit-transition:opacity 0.8s ease,-webkit-transform 0.8s var(--ease-out-back);transition:opacity 0.8s ease,transform 0.8s var(--ease-out-back);text-align:center;will-change:transform,opacity}
    .blessing-line.visible{opacity:1;-webkit-transform:translateY(0);transform:translateY(0)}
    .blessing-line.highlight{font-size:18px;color:var(--c-moon);text-shadow:0 0 34px rgba(246,215,139,0.5),0 0 80px rgba(232,77,134,0.25);font-weight:400;-webkit-transform:scale(0.6) translateY(15px);transform:scale(0.6) translateY(15px)}
    .blessing-line.highlight.visible{-webkit-transform:scale(1) translateY(0);transform:scale(1) translateY(0)}
    .blessing-line.emphasis{font-size:15px;color:rgba(255,200,230,0.95);font-weight:400;letter-spacing:1px;opacity:0}
    .blessing-line.final-vow{font-size:clamp(24px,7vw,40px);line-height:1.45;letter-spacing:2px;color:#FFF4D6;text-shadow:0 0 28px rgba(246,215,139,0.72),0 0 90px rgba(255,157,189,0.34);font-weight:500}
    .blessing-line.final-sub{font-size:15px;color:rgba(255,238,220,0.72);letter-spacing:2px}
    .blessing-line.emphasis.visible{opacity:1}
    .blessing-divider{width:30px;height:1px;background:-webkit-linear-gradient(left,transparent,rgba(255,180,200,0.4),transparent);background:linear-gradient(90deg,transparent,rgba(255,180,200,0.4),transparent);margin:8px auto;opacity:0;-webkit-transform:scaleX(0);transform:scaleX(0);-webkit-transition:opacity 1s ease 0.3s,-webkit-transform 1s ease 0.3s;transition:opacity 1s ease 0.3s,transform 1s ease 0.3s}
    .blessing-divider.visible{opacity:1;-webkit-transform:scaleX(1);transform:scaleX(1)}
    .blessing-progress{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;gap:8px;margin-top:20px}
    .blessing-dot{width:6px;height:6px;-webkit-border-radius:50%;border-radius:50%;background:rgba(255,255,255,0.1);-webkit-transition:background 0.6s ease,-webkit-transform 0.6s ease;transition:background 0.6s ease,transform 0.6s ease}
    .blessing-dot.active{background:rgba(255,180,200,0.8);box-shadow:0 0 12px rgba(255,105,180,0.5);-webkit-transform:scale(1.3);transform:scale(1.3)}
    .blessing-dot.passed{background:rgba(255,180,200,0.3)}
    .progress{position:fixed;top:0;left:0;height:3px;background:-webkit-linear-gradient(left,var(--c-pink-light),var(--c-pink),var(--c-purple),var(--c-pink-hot));background:linear-gradient(90deg,var(--c-pink-light),var(--c-pink),var(--c-purple),var(--c-pink-hot));z-index:30;-webkit-transition:width 0.3s ease,opacity 1.5s ease;transition:width 0.3s ease,opacity 1.5s ease;-webkit-box-shadow:0 0 15px rgba(255,105,180,0.7),0 3px 10px rgba(255,105,180,0.3);box-shadow:0 0 15px rgba(255,105,180,0.7),0 3px 10px rgba(255,105,180,0.3);will-change:width;contain:layout style}
    .cat-corner{position:fixed;bottom:var(--safe-bottom);left:12px;z-index:50;opacity:0;-webkit-transform:translateY(40px) scale(0.7);transform:translateY(40px) scale(0.7);-webkit-transition:opacity 1.2s var(--ease-out-back),-webkit-transform 1.2s var(--ease-out-back);transition:opacity 1.2s var(--ease-out-back),transform 1.2s var(--ease-out-back);cursor:pointer;pointer-events:auto;will-change:transform,opacity}
    .cat-corner.show{opacity:1;-webkit-transform:translateY(0) scale(1);transform:translateY(0) scale(1)}
    .cat-corner.show .cat-svg{-webkit-animation:catIdle 5s ease-in-out infinite;animation:catIdle 5s ease-in-out infinite}
    @-webkit-keyframes catIdle{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-5px)}}@keyframes catIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .cat-corner:active{-webkit-transform:scale(0.9)!important;transform:scale(0.9)!important}
    .cat-svg{width:90px;height:auto;display:block;-webkit-filter:drop-shadow(0 3px 10px rgba(0,0,0,0.3));filter:drop-shadow(0 3px 10px rgba(0,0,0,0.3));-webkit-transition:-webkit-transform 0.3s ease;transition:transform 0.3s ease;will-change:transform}
    .cat-bubble{position:absolute;bottom:105px;left:-15px;background:-webkit-linear-gradient(135deg,#fff,#FFF5F8);background:linear-gradient(135deg,#fff,#FFF5F8);padding:10px 16px;-webkit-border-radius:var(--radius-lg);border-radius:var(--radius-lg);font-size:14px;color:var(--c-pink);-webkit-box-shadow:0 4px 20px rgba(0,0,0,0.15),0 0 40px rgba(255,105,180,0.1);box-shadow:0 4px 20px rgba(0,0,0,0.15),0 0 40px rgba(255,105,180,0.1);opacity:0;-webkit-transform:translateY(15px) scale(0.7);transform:translateY(15px) scale(0.7);-webkit-transition:opacity 0.5s var(--ease-out-back),-webkit-transform 0.5s var(--ease-out-back);transition:opacity 0.5s var(--ease-out-back),transform 0.5s var(--ease-out-back);white-space:nowrap;pointer-events:none;max-width:180px;line-height:1.5;will-change:transform,opacity}
    .cat-bubble::after{content:'';position:absolute;bottom:-10px;left:25px;border-left:10px solid transparent;border-right:10px solid transparent;border-top:12px solid #fff}
    .cat-bubble.show{opacity:1;-webkit-transform:translateY(0) scale(1);transform:translateY(0) scale(1)}
    .cat-hearts{position:absolute;top:-20px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);display:-webkit-flex;display:flex;gap:6px;opacity:0;-webkit-transition:opacity 0.3s;transition:opacity 0.3s}
    .cat-hearts.show{opacity:1}
    .cat-hearts span{font-size:16px;-webkit-animation:heartFloat 1.2s ease-out forwards;animation:heartFloat 1.2s ease-out forwards}
    .music-toggle{position:fixed;bottom:var(--safe-bottom);right:12px;z-index:50;opacity:0;-webkit-transform:translateY(30px);transform:translateY(30px);-webkit-transition:opacity 1s ease,-webkit-transform 1s ease;transition:opacity 1s ease,transform 1s ease;cursor:pointer;pointer-events:auto;width:36px;height:36px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-border-radius:50%;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);will-change:transform,opacity}
    .music-toggle.show{opacity:1;-webkit-transform:translateY(0);transform:translateY(0)}
    .music-toggle:active{-webkit-transform:scale(0.85);transform:scale(0.85)}
    .music-icon{font-size:20px;-webkit-transition:opacity 0.3s;transition:opacity 0.3s}
    @-webkit-keyframes heartFloat{0%{-webkit-transform:translateY(0) scale(1);opacity:1}100%{-webkit-transform:translateY(-50px) scale(0.3);opacity:0}}@keyframes heartFloat{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-50px) scale(0.3);opacity:0}}
    #opening,.envelope,.top-num,.blessing-line,.cat-corner,.cat-bubble,.music-toggle,.blessing-divider{-webkit-backface-visibility:hidden;backface-visibility:hidden}
  </style>
</head>
<body>
<div id="opening">
  <div class="opening-orbit"></div>
  <div class="envelope" id="envelope">
    <div class="envelope-flap"></div>
    <div class="envelope-heart">💌</div>
    <div class="envelope-body"></div>
    <div class="envelope-seal"></div>
    <div class="envelope-label">2025.05.27</div>
  </div>
  <div class="open-tip">点击信封，开启我们的回忆</div>
  <div class="open-sub">OUR 1ST ANNIVERSARY</div>
</div>
<canvas id="c"></canvas>
<div class="story-signal" id="storySignal">
  <div>
    <span class="signal-kicker" id="signalKicker"></span>
    <span class="signal-main" id="signalMain"></span>
    <span class="signal-sub" id="signalSub"></span>
  </div>
</div>
<div class="progress" id="progress" style="width:0%"></div>
<div class="ui-layer top-bar" id="uiTop">
  <div class="top-label">成为家人的第一年</div>
  <div class="top-num" id="dayNum">0</div>
  <div class="top-unit">天</div>
  <div class="top-date">2025.05.27 — 2026.05.27</div>
</div>
<div class="ui-layer tap-hint" id="uiHint">触摸屏幕放烟花 · 点击小猫互动</div>
<div id="blessingPanel">
  <div class="blessing-card">
    <div class="blessing-section-label" id="blessingLabel"></div>
    <div id="blessingContent"></div>
    <div class="blessing-progress" id="blessingProgress"></div>
  </div>
</div>
<div class="cat-corner" id="catCorner">
  <div class="cat-hearts" id="catHearts"><span>❤️</span><span>💕</span><span>🐱</span><span>🐱</span></div>
  <div class="cat-bubble" id="catBubble">我们永远在一起 💕</div>
  <svg class="cat-svg" viewBox="0 0 220 140" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="catG1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFB6C1"/><stop offset="100%" stop-color="#FF9AAF"/></linearGradient>
      <linearGradient id="catG2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C8A2D4"/><stop offset="100%" stop-color="#B08FC4"/></linearGradient>
    </defs>
    <g transform="translate(15,20)">
      <ellipse cx="50" cy="90" rx="35" ry="28" fill="url(#catG1)"/>
      <circle cx="50" cy="52" r="30" fill="url(#catG1)"/>
      <polygon points="26,30 20,5 42,25" fill="url(#catG1)"/><polygon points="30,28 24,10 40,24" fill="#FFCDD8"/>
      <polygon points="74,30 80,5 58,25" fill="url(#catG1)"/><polygon points="70,28 76,10 60,24" fill="#FFCDD8"/>
      <path d="M36 50 Q40 44 44 50" stroke="#5D3A4A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M56 50 Q60 44 64 50" stroke="#5D3A4A" stroke-width="2.5" fill="none" stroke-linecap="round"/>

<script>
(function(){
'use strict';

var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W,H,cx,cy,dpr=Math.min(window.devicePixelRatio||1,2);

resize();window.addEventListener('resize',resize);

function R(a,b){return a+Math.random()*(b-a)}

function hx(t){return 16*Math.pow(Math.sin(t),3)}

var isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
var particles=[],stars=[],fireworks=[],trails=[],auroras=[],shooters=[];

function Star(){this.x=R(0,W);this.y=R(0,H);this.s=R(0.5,2.5);this.a=R(0.2,0.8);this.sp=R(0.004,0.018);this.ph=R(0,6.28)}
Star.prototype.up=function(dt){this.ph+=this.sp*dt;this.a=0.2+Math.sin(this.ph)*0.4};
Star.prototype.dr=function(){var a=clamp(this.a,0,1),s=this.s;ctx.globalAlpha=a;ctx.fillStyle='rgba(255,248,255,'+a.toFixed(3)+')';ctx.beginPath();ctx.moveTo(this.x,this.y-s*2.5);ctx.quadraticCurveTo(this.x+s*0.3,this.y-s*0.3,this.x+s*2.5,this.y);ctx.quadraticCurveTo(this.x+s*0.3,this.y+s*0.3,this.x,this.y+s*2.5);ctx.quadraticCurveTo(this.x-s*0.3,this.y+s*0.3,this.x-s*2.5,this.y);ctx.quadraticCurveTo(this.x-s*0.3,this.y-s*0.3,this.x,this.y-s*2.5);ctx.fill();ctx.globalAlpha=1};

function Aurora(){this.reset()}
Aurora.prototype.reset=function(){this.x=R(-150,W+150);this.y=R(H*0.08,H*0.45);this.w=R(250,600);this.speed=R(0.3,1);this.hue=R(280,350);this.alpha=R(0.03,0.08);this.ph=R(0,6.28)};
Aurora.prototype.up=function(dt){this.x+=this.speed*dt;this.ph+=0.012*dt;this.alpha=0.04+Math.sin(this.ph)*0.025;if(this.x>W+250)this.reset()};
Aurora.prototype.dr=function(){var g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.w*0.6);g.addColorStop(0,'hsla('+this.hue+',70%,55%,'+this.alpha+')');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(this.x-this.w*0.6,this.y-40,this.w*1.2,80)};

function HP(tx,ty,col,sz){this.x=R(0,W);this.y=R(0,H);this.tx=tx;this.ty=ty;this.col=col;this.sz=sz;this.a=R(0.5,1);this.vx=0;this.vy=0;this.fr=0.92+R(0,0.06);this.sp=0.025+R(0,0.03);this.ph=R(0,6.28);this.bs=R(0.01,0.03);this.freed=false;this.fvx=0;this.fvy=0;this.life=1;this.glow=R(0,1)>0.65}
HP.prototype.up=function(mx,my,dt){
  if(this.freed){this.x+=this.fvx*dt;this.y+=this.fvy*dt;this.fvy+=0.04*dt;this.life-=0.01*dt;this.a=this.life;return}
  var dx=this.tx-this.x,dy=this.ty-this.y;
  this.vx+=dx*this.sp*dt;this.vy+=dy*this.sp*dt;this.vx*=Math.pow(this.fr,dt);this.vy*=Math.pow(this.fr,dt);
  if(mx!==null){var mdx=this.x-mx,mdy=this.y-my,md=Math.sqrt(mdx*mdx+mdy*mdy);if(md<120){var f=(120-md)/120*8;this.vx+=mdx/md*f;this.vy+=mdy/md*f}}
  this.x+=this.vx;this.y+=this.vy;this.ph+=this.bs*dt;this.a=0.45+Math.sin(this.ph)*0.4
};
HP.prototype.dr=function(){
  if(this.a<=0)return;var alpha=clamp(this.a,0,1);
  if(this.glow){var grd=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.sz*5);grd.addColorStop(0,this.col.replace('A)',(alpha*0.18).toFixed(3)+')'));grd.addColorStop(1,this.col.replace('A)','0)'));ctx.globalAlpha=1;ctx.fillStyle=grd;ctx.beginPath();ctx.arc(this.x,this.y,this.sz*5,0,6.28);ctx.fill()}
  ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(this.x,this.y,this.sz,0,6.28);ctx.fillStyle=this.col.replace('A)',alpha.toFixed(3)+')');ctx.fill();ctx.globalAlpha=1
};

function FW(x,y,type){this.ps=[];var n=type==='ring'?70:type==='willow'?100:type==='sparkle'?60:55;var hue=R(290,380)%360;for(var i=0;i<n;i++){var ang=(6.28/n)*i+R(-0.15,0.15);var spd=type==='ring'?R(4,7):type==='willow'?R(1.5,5):type==='sparkle'?R(3,6):R(2.5,6);this.ps.push({x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,a:1,s:R(1.5,4),h:(hue+R(-30,30))%360,d:R(0.006,0.018),willow:type==='willow',sparkle:type==='sparkle'})}}
FW.prototype.up=function(dt){for(var i=this.ps.length-1;i>=0;i--){var p=this.ps[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.willow?0.08*dt:0.04*dt;p.vx*=Math.pow(0.97,dt);p.vy*=Math.pow(0.97,dt);p.a-=p.d*dt;if(p.sparkle)p.s*=Math.pow(0.96,dt);if(p.a<=0)this.ps.splice(i,1)}};
FW.prototype.dr=function(){for(var i=0;i<this.ps.length;i++){var p=this.ps[i];ctx.globalAlpha=p.a;ctx.fillStyle='hsla('+p.h+',100%,85%,'+p.a.toFixed(3)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.s*2,0,6.28);ctx.fill();if(p.willow){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*3,p.y-p.vy*3);ctx.strokeStyle='hsla('+p.h+',80%,60%,'+(p.a*0.5).toFixed(3)+')';ctx.lineWidth=2;ctx.stroke()}ctx.globalAlpha=1}};
FW.prototype.done=function(){return this.ps.length===0};

function Trail(x,y){this.x=x;this.y=y;this.s=R(3,8);this.a=1;this.vx=R(-2,2);this.vy=R(-2,2);this.d=R(0.025,0.06);this.h=R(300,380)}
Trail.prototype.up=function(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.a-=this.d*dt;this.s*=Math.pow(0.95,dt)};
Trail.prototype.dr=function(){if(this.a<=0)return;ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,6.28);ctx.fillStyle='hsla('+this.h+',100%,80%,'+this.a.toFixed(3)+')';ctx.fill()};

function ShootingStar(){this.x=R(W*0.1,W*0.9);this.y=R(0,H*0.2);this.spd=R(6,12);this.ang=R(0.3,0.8);this.life=1;this.decay=R(0.012,0.022);this.trail=[]}
ShootingStar.prototype.up=function(dt){this.x+=Math.cos(this.ang)*this.spd*dt;this.y+=Math.sin(this.ang)*this.spd*dt;this.trail.push({x:this.x,y:this.y,a:1});if(this.trail.length>25)this.trail.shift();this.trail.forEach(function(t){t.a*=Math.pow(0.88,dt)});this.life-=this.decay*dt};
ShootingStar.prototype.dr=function(){if(this.life<=0)return;for(var i=0;i<this.trail.length;i++){var t=this.trail[i],sz=1.2*(1-i/this.trail.length);ctx.beginPath();ctx.arc(t.x,t.y,sz,0,6.28);ctx.fillStyle='rgba(255,255,255,'+(t.a*this.life).toFixed(3)+')';ctx.fill()}ctx.beginPath();ctx.arc(this.x,this.y,2.5,0,6.28);ctx.fillStyle='rgba(255,255,255,'+(this.life*0.9).toFixed(3)+')';ctx.fill()};
ShootingStar.prototype.done=function(){return this.life<=0};

// ===== State =====
var started=false,elapsed=0,lastT=0;
var mx=null,my=null;
var hs=Math.min(W,H)*0.018,hoffY=-H*0.08;
var dayDone=false,dayStart=0;
var lastFW=0,FW_INTERVAL=667;
var lastShooter=0,SHOOTER_INTERVAL=2000;
var showBlessing=false,blessingIdx=0,blessingElapsed=0,endingTriggered=false;

// Time-based durations (ms)
var PHASE_FORM=3333,PHASE_BREATHE=6667;
var blessingDurs=[8000,6000,6000,10000];

var blessings=[
  {label:'· 起 ·',lines:[{text:'这一年，有平淡，也有琐碎'},{text:'但更多的是细碎的安心'},{divider:true},{text:'一起吃饭，一起下班'},{text:'一起聊今天发生的小事'},{text:'那些看起来普通的日子',cls:'emphasis'},{text:'慢慢有了重量',cls:'highlight'}]},
  {label:'· 承 ·',lines:[{text:'没有轰轰烈烈的剧情'},{text:'也没有刻意制造的浪漫'},{divider:true},{text:'可在很多普通瞬间里',cls:'emphasis'},{text:'我都一次次确认'},{text:'你在，我也在',cls:'highlight'},{text:'这件事本身，就很珍贵',cls:'highlight'}]},
  {label:'· 转 ·',lines:[{text:'从“我们在一起”'},{text:'到“我们是一家人”',cls:'emphasis'},{divider:true},{text:'日子没有突然变得盛大'},{text:'只是多了一个确定的方向'},{text:'不耀眼，却很踏实',cls:'highlight'}]},
  {label:'· 合 ·',lines:[{text:'365天，不长'},{text:'却足够让我明白'},{divider:true},{text:'我想要的生活'},{text:'刚好是有你的样子',cls:'highlight'},{text:'往后每一天，都算数',cls:'emphasis'},{text:'也都与你有关',cls:'highlight'}]}
];

function initStars(){var n=isMobile?150:300;for(var i=0;i<n;i++)stars.push(new Star())}
function initAurora(){var n=isMobile?5:10;for(var i=0;i<n;i++)auroras.push(new Aurora())}
function initHeart(){
  particles=[];hs=Math.min(W,H)*0.018;hoffY=-H*0.08;
  var cols=['rgba(246,215,139,A)','rgba(255,157,189,A)','rgba(255,205,224,A)','rgba(143,199,255,A)','rgba(255,244,214,A)','rgba(207,165,232,A)'];
  var oN=isMobile?600:1200,iN=isMobile?250:500;
  for(var i=0;i<oN;i++){var t=(6.28/oN)*i+R(-0.06,0.06),s=hs*R(0.9,1.05);particles.push(new HP(cx+hx(t)*s,cy+hoffY+hy(t)*s,cols[Math.floor(R(0,cols.length))],R(1.3,3)))}
  for(var i=0;i<iN;i++){var t=R(0,6.28),r=R(0.1,0.85),s=hs*r;particles.push(new HP(cx+hx(t)*s,cy+hoffY+hy(t)*s,cols[Math.floor(R(0,cols.length))],R(1,2.5)))}
}

function showBlessingAt(idx){
  var b=blessings[idx],content=document.getElementById('blessingContent'),label=document.getElementById('blessingLabel');
  content.innerHTML='';label.textContent=b.label;
  var li=0;
  b.lines.forEach(function(item){
    if(item.divider){var div=document.createElement('div');div.className='blessing-divider';content.appendChild(div);setTimeout(function(){div.classList.add('visible')},li*500+300);return}
    var p=document.createElement('p');p.className='blessing-line'+(item.cls?' '+item.cls:'');p.textContent=item.text;content.appendChild(p);
    var d=li*500;if(item.cls==='highlight')d+=150;if(item.cls==='emphasis')d-=100;d=Math.max(0,d);
    setTimeout(function(){p.classList.add('visible')},d);li++
  });
  var prog=document.getElementById('blessingProgress');prog.innerHTML='';
  blessings.forEach(function(_,i){var dot=document.createElement('div');dot.className='blessing-dot';if(i===idx)dot.classList.add('active');else if(i<idx)dot.classList.add('passed');prog.appendChild(dot)});
  document.getElementById('blessingPanel').classList.add('show');
}
function hideBlessing(){document.getElementById('blessingPanel').classList.remove('show')}
function showStorySignal(kicker,main,sub,dur){
  var el=document.getElementById('storySignal');
  document.getElementById('signalKicker').textContent=kicker||'';
  document.getElementById('signalMain').textContent=main||'';
  document.getElementById('signalSub').textContent=sub||'';
  el.classList.add('show');
  clearTimeout(showStorySignal.t);
  showStorySignal.t=setTimeout(function(){el.classList.remove('show')},dur||2300)
}

function triggerEnding(){
  particles=[];hs=Math.min(W,H)*0.015;
  showStorySignal('1ST ANNIVERSARY','领证一周年快乐','成为家人的第一年',3000);
  var ringR=hs*6,cols=['rgba(246,215,139,A)','rgba(255,157,189,A)','rgba(143,199,255,A)','rgba(255,244,214,A)'];
  var rN=isMobile?250:500,rN2=isMobile?100:200;
  for(var i=0;i<rN;i++){var ang=(6.28/rN)*i+R(-0.1,0.1),r=ringR*R(0.9,1.1);var p=new HP(cx+Math.cos(ang)*r,cy+hoffY+Math.sin(ang)*r,cols[Math.floor(R(0,cols.length))],R(1.5,3));p.sp=0.04+R(0,0.02);p.glow=true;particles.push(p)}
  for(var i=0;i<rN2;i++){var ang=(6.28/rN2)*i+R(-0.15,0.15),r=ringR*0.55*R(0.9,1.1);var p=new HP(cx+Math.cos(ang)*r,cy+hoffY+Math.sin(ang)*r,cols[Math.floor(R(0,cols.length))],R(1,2.2));p.sp=0.05+R(0,0.02);p.glow=true;particles.push(p)}
  var fwTypes=['ring','willow','sparkle','normal'];
  for(var i=0;i<6;i++)(function(idx){setTimeout(function(){fireworks.push(new FW(cx+R(-180,180),cy+R(-120,60),fwTypes[idx%4]));fireworks.push(new FW(cx+R(-250,250),cy+R(-100,80),fwTypes[(idx+1)%4]))},idx*300)})(i);
  setTimeout(function(){
    var panel=document.getElementById('blessingPanel'),content=document.getElementById('blessingContent'),label=document.getElementById('blessingLabel');
    label.textContent='♡';content.innerHTML='';
    var t1=document.createElement('p');t1.className='blessing-line final-vow';t1.textContent='领证一周年快乐';content.appendChild(t1);
    var div=document.createElement('div');div.className='blessing-divider';content.appendChild(div);
    var t2=document.createElement('p');t2.className='blessing-line final-sub';t2.textContent='成为家人的第一年';content.appendChild(t2);
    var t3=document.createElement('p');t3.className='blessing-line';t3.style.cssText='font-size:13px;color:rgba(255,238,220,0.56);margin-top:12px';t3.textContent='2025.05.27 — 2026.05.27 · 往后每一天，都算数，也都与你有关';content.appendChild(t3);
    setTimeout(function(){t1.classList.add('visible');div.classList.add('visible')},100);
    setTimeout(function(){t2.classList.add('visible');t3.classList.add('visible')},600);
    panel.classList.add('show');
    for(var i=0;i<8;i++)(function(idx){setTimeout(function(){fireworks.push(new FW(cx+R(-200,200),cy+R(-150,50),fwTypes[idx%4]))},idx*200)})(i);
    var cb=document.getElementById('catBubble');cb.textContent='祝你们永远幸福！🎉';cb.classList.add('show');setTimeout(function(){cb.classList.remove('show')},5000)
  },2500)
}

function drawBg(){
  var g=ctx.createRadialGradient(cx,cy*0.5,0,cx,cy,Math.max(W,H));
  g.addColorStop(0,'#17162D');g.addColorStop(0.32,'#0A0715');g.addColorStop(1,'#020106');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var g2=ctx.createRadialGradient(cx,cy*0.32,0,cx,cy*0.32,W*0.75);g2.addColorStop(0,'rgba(246,215,139,0.075)');g2.addColorStop(0.45,'rgba(232,77,134,0.035)');g2.addColorStop(1,'transparent');ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
  var g3=ctx.createLinearGradient(0,0,W,H);g3.addColorStop(0,'rgba(143,199,255,0.045)');g3.addColorStop(0.5,'transparent');g3.addColorStop(1,'rgba(246,215,139,0.035)');ctx.fillStyle=g3;ctx.fillRect(0,0,W,H)
}

function loop(now){
  requestAnimationFrame(loop);
  if(!started)return;
  if(!lastT){lastT=now;return}
  var dt=Math.min((now-lastT)/16.67,3); // normalize: 1.0 = 60fps frame
  var dtMs=now-lastT;
  lastT=now;
  elapsed+=dtMs;

  drawBg();

  if(particles.length>0&&!endingTriggered){
    var glowR=Math.min(W,H)*0.22;
    var glowGrad=ctx.createRadialGradient(cx,cy+hoffY,0,cx,cy+hoffY,glowR);
    glowGrad.addColorStop(0,'rgba(255,80,160,0.06)');glowGrad.addColorStop(0.5,'rgba(200,60,140,0.02)');glowGrad.addColorStop(1,'rgba(150,40,120,0)');
    ctx.fillStyle=glowGrad;ctx.fillRect(cx-glowR,cy+hoffY-glowR,glowR*2,glowR*2)
  }

  auroras.forEach(function(a){a.up(dt);a.dr()});
  stars.forEach(function(s){s.up(dt);s.dr()});

  if(elapsed-lastShooter>SHOOTER_INTERVAL&&Math.random()>0.4){shooters.push(new ShootingStar());lastShooter=elapsed;SHOOTER_INTERVAL=1500+Math.random()*2000}
  shooters=shooters.filter(function(s){s.up(dt);s.dr();return!s.done()});

  trails=trails.filter(function(t){t.up(dt);t.dr();return t.a>0});
  particles.forEach(function(p){p.up(mx,my,dt);p.dr()});
  fireworks=fireworks.filter(function(f){f.up(dt);f.dr();return!f.done()});

  // Phase timing — ALL TIME-BASED
  if(elapsed<PHASE_FORM){/* forming */}
  else if(elapsed<PHASE_BREATHE){
    if(elapsed-lastFW>FW_INTERVAL){lastFW=elapsed;fireworks.push(new FW(R(W*0.12,W*0.88),R(H*0.12,H*0.45),['ring','willow','sparkle'][Math.floor(R(0,3))]))}
  }
  else if(elapsed>=PHASE_BREATHE&&!showBlessing){
    showBlessing=true;blessingIdx=0;blessingElapsed=0;showBlessingAt(0);
    for(var i=0;i<8;i++)fireworks.push(new FW(cx+R(-150,150),cy+R(-100,60),['ring','willow','sparkle','normal'][i%4]))
  }
  if(showBlessing){
    blessingElapsed+=dtMs;
    var dur=blessingDurs[blessingIdx]||6000;
    // Auto fireworks
    if(elapsed-lastFW>900){lastFW=elapsed;if(!endingTriggered)fireworks.push(new FW(R(W*0.1,W*0.9),R(H*0.1,H*0.5),['ring','willow','sparkle'][Math.floor(R(0,3))]))}
    if(!endingTriggered&&blessingElapsed>=dur){
      blessingElapsed=0;hideBlessing();
      if(blessingIdx===blessings.length-1){endingTriggered=true;setTimeout(triggerEnding,800)}
      else{setTimeout(function(){blessingIdx++;showBlessingAt(blessingIdx);for(var i=0;i<4;i++)fireworks.push(new FW(R(W*0.15,W*0.85),R(H*0.15,H*0.55),'ring'))},800)}
    }
    if(endingTriggered&&blessingElapsed>35000){particles=[];initHeart();blessingElapsed=0;blessingIdx=0;endingTriggered=false}
  }

  var prog=Math.min(elapsed/30000,1)*100;
  var progEl=document.getElementById('progress');progEl.style.width=prog+'%';
  if(prog>=100)progEl.style.opacity=String(Math.max(0,1-(elapsed-30000)/3333));

  if(!dayDone&&dayStart>0){var el=performance.now()-dayStart,p=Math.min(el/3000,1),e=1-Math.pow(1-p,3);document.getElementById('dayNum').textContent=Math.round(e*365);if(p>=1)dayDone=true}
}

function begin(){
  started=true;
  var op=document.getElementById('opening');op.classList.add('hide');setTimeout(function(){op.style.display='none'},2000);
  setTimeout(function(){showStorySignal('MARRIED FOR','365 天','这一年，慢慢变成了家',2600)},650);
  setTimeout(function(){document.getElementById('uiTop').classList.add('show');document.getElementById('catCorner').classList.add('show');document.getElementById('uiHint').classList.add('show');document.getElementById('musicToggle').classList.add('show')},1500);
  initStars();initAurora();initHeart();dayStart=performance.now()
}

var envelope=document.getElementById('envelope'),opened=false;
envelope.addEventListener('click',function(){if(!opened){opened=true;envelope.classList.add('open');setTimeout(begin,1300)}});
envelope.addEventListener('touchend',function(e){e.preventDefault();if(!opened){opened=true;envelope.classList.add('open');setTimeout(begin,1300)}});

var longPressTimer=null,longPressActive=false;
function onMove(x,y){mx=x;my=y;if(started)for(var i=0;i<4;i++)trails.push(new Trail(x,y))}
function startLongPress(x,y){longPressTimer=setTimeout(function(){longPressActive=true;for(var i=0;i<20;i++){var heart=document.createElement('div');heart.style.cssText='position:fixed;pointer-events:none;font-size:'+(14+Math.random()*14)+'px;z-index:60;opacity:1;transition:all '+(1.5+Math.random())+'s ease-out;left:'+(x-10+Math.random()*20)+'px;top:'+y+'px;';heart.textContent=['❤️','💕','💖','💗','💓','🌸','✨'][Math.floor(R(0,7))];document.body.appendChild(heart);requestAnimationFrame(function(){heart.style.top=(y-200-Math.random()*200)+'px';heart.style.left=(parseFloat(heart.style.left)+R(-60,60))+'px';heart.style.opacity='0'});setTimeout(function(el){return function(){el.remove()}}(heart),3000)}},500)}
function endLongPress(){clearTimeout(longPressTimer);longPressActive=false}
cv.addEventListener('mousemove',function(e){onMove(e.clientX,e.clientY)});
cv.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];onMove(t.clientX,t.clientY)},{passive:false});
cv.addEventListener('touchend',function(){mx=null;my=null;endLongPress()});
cv.addEventListener('mouseleave',function(){mx=null;my=null;endLongPress()});
cv.addEventListener('click',function(e){if(started&&!longPressActive)fireworks.push(new FW(e.clientX,e.clientY,['ring','willow','sparkle','normal'][Math.floor(R(0,4))]))});
cv.addEventListener('touchstart',function(e){if(started&&e.target===cv){var t=e.touches[0];fireworks.push(new FW(t.clientX,t.clientY,'ring'));startLongPress(t.clientX,t.clientY)}},{passive:true});

var lastShake=0;
window.addEventListener('devicemotion',function(e){if(!started)return;var a=e.accelerationIncludingVelocity||e.accelerationIncludingGravity;if(!a)return;var force=Math.sqrt((a.x||0)*(a.x||0)+(a.y||0)*(a.y||0)+(a.z||0)*(a.z||0));if(force>25&&Date.now()-lastShake>3000){lastShake=Date.now();for(var i=0;i<15;i++)fireworks.push(new FW(R(W*0.1,W*0.9),R(H*0.1,H*0.5),['ring','sparkle'][i%2]));var cb=document.getElementById('catBubble');cb.textContent='哇！被你发现了！✨';cb.classList.add('show');setTimeout(function(){cb.classList.remove('show')},3000)}});

var catEl=document.getElementById('catCorner');
var catMsgs=['我们永远在一起 💕','一周年快乐！🎉','喵~你们好甜呀 🐱','要一直幸福哦！💖','每一天都与你有关 ✨','喵呜~永远爱你 💜','领证纪念日快乐！🎊','我们会一直走下去的 🌸'];
catEl.addEventListener('click',function(){
  var b=document.getElementById('catBubble');b.textContent=catMsgs[Math.floor(R(0,catMsgs.length))];
  b.classList.remove('show');setTimeout(function(){b.classList.add('show')},50);setTimeout(function(){b.classList.remove('show')},4000);
  var h=document.getElementById('catHearts');h.classList.remove('show');setTimeout(function(){h.classList.add('show')},50);setTimeout(function(){h.classList.remove('show')},1200);
  var img=catEl.querySelector('.cat-svg');img.style.transition='transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275)';img.style.transform='scale(1.3) rotate(10deg)';
  setTimeout(function(){img.style.transform='scale(1) rotate(-5deg)'},200);setTimeout(function(){img.style.transform='scale(1.1) rotate(3deg)'},400);setTimeout(function(){img.style.transform=''},600);
  fireworks.push(new FW(cx,cy*0.55,'ring'));fireworks.push(new FW(cx-60,cy*0.4,'sparkle'));fireworks.push(new FW(cx+60,cy*0.45,'willow'))
});

loop();

var audioCtx=null,analyser=null,musicStarted=false,musicMuted=false,masterGain=null,bgAudio=null;
var audioData=new Uint8Array(64);
function initMusic(){if(musicStarted)return;musicStarted=true;try{
audioCtx=new(window.AudioContext||window.webkitAudioContext)();
if(audioCtx.state==='suspended')audioCtx.resume();
masterGain=audioCtx.createGain();
masterGain.gain.value=0.6;
analyser=audioCtx.createAnalyser();
analyser.fftSize=128;
masterGain.connect(analyser);
analyser.connect(audioCtx.destination);
bgAudio=new Audio();
bgAudio.loop=true;
bgAudio.preload='auto';
bgAudio.src='bgm.mp3';
bgAudio.load();
var src=audioCtx.createMediaElementSource(bgAudio);
src.connect(masterGain);
bgAudio.play().catch(function(){
  // Autoplay blocked, wait for user interaction
  var resumePlay=function(){
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
    if(bgAudio&&bgAudio.paused)bgAudio.play().catch(function(){});
    document.removeEventListener('touchstart',resumePlay);
    document.removeEventListener('click',resumePlay);
  };
  document.addEventListener('touchstart',resumePlay);
  document.addEventListener('click',resumePlay);
});
}catch(e){}}
function toggleMusic(){
  if(!musicStarted)initMusic();
  if(!audioCtx||!masterGain)return;
  musicMuted=!musicMuted;
  masterGain.gain.setValueAtTime(musicMuted?0:0.6,audioCtx.currentTime);
  document.getElementById('musicIcon').textContent=musicMuted?'🔇':'🔊'
}
window.toggleMusic=toggleMusic;
function tryStartMusic(){if(!musicStarted&&started){initMusic()}if(musicStarted){document.removeEventListener('touchstart',tryStartMusic);document.removeEventListener('click',tryStartMusic)}}
document.addEventListener('touchstart',tryStartMusic);document.addEventListener('click',tryStartMusic);
var musicPoll=setInterval(function(){if(musicStarted)clearInterval(musicPoll)},1000);
})();
</script>
